dataset: lisa_signs
summary_path: data/lisa_signs_clf/summary.json

groups:
  warning:
    prefixes: ["warning_", "pedestrian_", "signal_", "merge", "lane_"]
  speed_limit:
    prefixes: ["speed_limit_", "ramp_speed_advisory_", "truck_speed_limit_"]
  stop_yield:
    exact: ["stop", "yield"]
  prohibition:
    prefixes: ["no_", "do_not", "wrong_way"]
  mandatory_direction:
    prefixes: ["turn_", "keep_", "right_lane_must_turn", "thru_"]

critical_signs:
  stop:
    exact: ["stop"]
  yield:
    exact: ["yield"]
  speed_limit:
    prefixes: ["speed_limit_", "school_speed_limit_", "truck_speed_limit_"]
  no_entry:
    prefixes: ["no_entry", "do_not_enter", "wrong_way"]

weights:
  default_error: 1
  within_warning: 1
  speed_limit_more_conservative: 2
  speed_limit_less_conservative: 4
  speed_limit_to_nonspeed: 5
  critical_sign_error: 6
  stop_yield_to_nonpriority: 5
  prohibition_to_permissive: 5
  warning_to_nonwarning: 3
  mandatory_to_nonmandatory: 4
