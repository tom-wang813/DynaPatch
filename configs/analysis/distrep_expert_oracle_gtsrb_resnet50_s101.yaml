pre_id: distrep_expert_oracle_gtsrb_resnet50_s101
engineering_stage: scripted_probe
description: Test-label oracle over DistRep's five pre-integration experts.
research_decision: Decide whether expert integration hides complementary held-out repairs.
hypothesis_or_signal: Oracle-union RR_held exceeds merged DistRep RR_held by at least 0.10.
date: 2026-09-04
data:
  setting: gtsrb/resnet50
  split_root: artifacts/bug_sets/v8_splits_seed101/gtsrb_resnet50
  training_evidence: gtsrb_bug_train_indices.json
  held_test: gtsrb_bug_eval_indices.json
  clean_test: gtsrb_clean_test_indices.json
  seed: 101
  reporting_policy: report repair_holdout_unseen and clean_eval only
method:
  name: DistRep-PSO pre-integration expert oracle
  n_partitions: 5
  top_k_weights: 1024
  phase2_particles: 40
  phase2_iterations: 40
  phase3_integration_particles: 30
  phase3_integration_iterations: 30
  clean_cap: 2048
  preserve_split: clean_train
  rng_seed: 101
compute:
  device: cuda:0
  precision: fp32
  num_workers: 4
  expected_runtime: approximately 53 minutes from the previous full-budget cell
  expected_bottleneck: GPU compute
  monitoring: nvidia-smi -i 0 and runner stdout
output_dir: outputs/distrep_expert_oracle_gtsrb_resnet50_s101
entrypoint: scripts/run_distrep_pso.py
analysis: scripts/analyze_distrep_expert_oracle.py
decision_rule: >-
  PROMOTE if oracle-union RR_held minus merged RR_held is at least 0.10;
  ABANDON if it is below 0.03; otherwise EXTEND to one additional setting.
